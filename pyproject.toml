[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redrgnn"
version = "0.1.0"
description = "ReDRGNN for drug repositioning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
redrgnn-train = "redrgnn.cli_train:main"
redrgnn-evaluate = "redrgnn.cli_evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
